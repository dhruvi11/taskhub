name: Mobile CI

on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"

  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  mobile:
    name: Mobile Checks

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Expo doctor
        run: npx expo-doctor