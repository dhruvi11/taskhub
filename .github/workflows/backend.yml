name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    name: Backend Checks

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: taskhub_password
          POSTGRES_DB: taskhub_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U taskhub -d taskhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://taskhub:taskhub_password@localhost:5432/taskhub_test
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://taskhub:taskhub_password@localhost:5432/taskhub_test
        run: npm test

      - name: Build
        run: npm run build